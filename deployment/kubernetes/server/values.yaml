app:
  name: server
  replicas: 1
  port: 3000

# Development domain - change to your assigned domain
domain: time.tasbes.online
path: /api

env: prod

envs:
  - name: GITLAB_ISSUER
    valueFrom:
      secretKeyRef:
        name: gitlab
        key: issuer
  - name: GITLAB_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: gitlab
        key: client
  - name: GITLAB_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: gitlab
        key: secret
  - name: FRONTEND_URL
    value: "https://time.tasbes.online"
  - name: BACKEND_URL
    value: "https://time.tasbes.online/api"

  - name: SESSION_SECRET
    valueFrom:
      secretKeyRef:
        name: session-secret
        key: secret

# Container image
image:
  repository: ghcr.io/melander00/nornir-server
  tag: "916b8bc"

postgres:
  database: postgres
  username: postgres
  existingSecret: db-creds
  passwordKey: password
  host: time-reporting-db
  port: 5432